name = "lanas-el-siglo"
workers_dev = true
compatibility_date = "2026-05-15"
# nodejs_compat lo agrega vinext durante el build; no lo repitas aqui.

# Base de datos D1 para ordenes, inventario, usuarios
[[d1_databases]]
binding = "DB"
database_name = "lanas-el-siglo-db"
database_id = "2edb6cb8-e9e1-443a-aab9-be50396ae5db"

# Binarios de la biblioteca de medios del panel (/admin).
# R2: operaciones ilimitadas (sin limite diario de Workers KV) y sirve
# imagenes publicas sin costo por lectura.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lanas-el-siglo-media"

# Variables de entorno
[vars]
SHOP_NAME = "Lanas el Siglo"
CURRENCY = "CLP"
# Destino de las cotizaciones. Solo digitos, con codigo de pais y sin signos:
# +56 9 9509 6522 se escribe 56995096522.
WHATSAPP_NUMBER = "56995096522"
